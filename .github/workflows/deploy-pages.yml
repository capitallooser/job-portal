name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat .pages_bundle/part-*.b64 > /tmp/job-portal.b64
          base64 --decode /tmp/job-portal.b64 > /tmp/job-portal.tar.gz
          echo "Decoded archive size: $(wc -c < /tmp/job-portal.tar.gz) bytes"
          gzip -t /tmp/job-portal.tar.gz
          rm -rf app
          mkdir app
          tar -xzf /tmp/job-portal.tar.gz -C app
          test -f app/package.json
          test -f app/index.html

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Build
        working-directory: app
        env:
          VITE_SUPABASE_URL: https://vizfrptpkdofnvykbtbh.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_kMixAxteWAZ01apzxAnNig_eZEX5KI5
          VITE_APP_NAME: TalentBridge
        run: npx vite build --base=/job-portal/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
