name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f job-portal-full-source.zip
          rm -rf app
          mkdir app
          unzip -q job-portal-full-source.zip -d app
          test -f app/package.json
          test -f app/index.html
          test -d app/src
          cp .pages_patch/fallbackParser.ts app/src/features/ai-import/fallbackParser.ts
          cp .pages_patch/ApplicationDetailPage.tsx app/src/features/applications/ApplicationDetailPage.tsx
          cp .pages_patch/applicationStatus.ts app/src/features/applications/applicationStatus.ts
          cp .pages_patch/jobActions.ts app/src/features/jobs/jobActions.ts
          cp .pages_patch/jobActions.test.ts app/src/features/jobs/jobActions.test.ts
          cp .pages_patch/SignupPage.tsx app/src/features/auth/SignupPage.tsx
          cp .pages_patch/authApi.ts app/src/features/auth/authApi.ts
          cp .pages_patch/authApi.test.ts app/src/features/auth/authApi.test.ts
          cp .pages_patch/tsconfig.json app/tsconfig.json

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Test critical actions
        working-directory: app
        run: npm test -- --run src/features/jobs/jobActions.test.ts src/features/auth/authApi.test.ts

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Build
        working-directory: app
        env:
          VITE_SUPABASE_URL: https://vizfrptpkdofnvykbtbh.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_kMixAxteWAZ01apzxAnNig_eZEX5KI5
          VITE_APP_NAME: TalentBridge
        run: npx vite build --base=/job-portal/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
