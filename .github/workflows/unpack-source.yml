name: Unpack source

on:
  push:
    branches: [feature/full-build]
    paths:
      - '.upload/UPLOAD_COMPLETE'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upload branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/chunk-* > /tmp/job-portal.tar.gz.b64
          base64 --decode /tmp/job-portal.tar.gz.b64 > /tmp/job-portal.tar.gz
          echo "4372085bbbd5c06d5c427111cbe48b7e4ca7895f82d9594d0236019cc0aa3b50  /tmp/job-portal.tar.gz" | sha256sum -c -
          tar -xzf /tmp/job-portal.tar.gz -C .
          rm -rf .upload
          rm -f .github/workflows/unpack-source.yml

      - name: Commit normal source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish complete job portal source"
          git push
